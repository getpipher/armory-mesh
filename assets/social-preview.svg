<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1280 640" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace">
  <!-- armory-mesh — GitHub social preview card (export to PNG 1280x640, upload in repo Settings). -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- subtle mesh-node backdrop -->
  <g stroke="#1f6feb" stroke-opacity="0.18" stroke-width="1.2" fill="none">
    <line x1="1040" y1="80" x2="1180" y2="180"/>
    <line x1="1180" y1="180" x2="1090" y2="330"/>
    <line x1="1090" y1="330" x2="1210" y2="470"/>
    <line x1="1040" y1="80" x2="1090" y2="330"/>
    <line x1="920" y1="150" x2="1040" y2="80"/>
    <line x1="920" y1="150" x2="1090" y2="330"/>
    <line x1="980" y1="520" x2="1090" y2="330"/>
  </g>
  <g fill="#58a6ff" fill-opacity="0.35">
    <circle cx="1040" cy="80" r="5"/>
    <circle cx="1180" cy="180" r="5"/>
    <circle cx="1090" cy="330" r="5"/>
    <circle cx="1210" cy="470" r="5"/>
    <circle cx="920" cy="150" r="5"/>
    <circle cx="980" cy="520" r="5"/>
  </g>

  <!-- wordmark + pitch -->
  <text x="80" y="130" font-size="20" fill="#58a6ff" font-weight="bold">@getpipher/armory-mesh</text>
  <text x="80" y="200" font-size="40" fill="#e6edf3" font-weight="bold">Your AI agents work in parallel.</text>
  <text x="80" y="254" font-size="40" fill="#e6edf3" font-weight="bold">Now they can work <tspan fill="#3fb950">together</tspan>.</text>
  <text x="80" y="312" font-size="19" fill="#8b949e">A hardened peer-to-peer mesh for pi coding-agent sessions —</text>
  <text x="80" y="340" font-size="19" fill="#8b949e">live presence · atomic claims · cross-session dup-checks · durable fleet memory.</text>
  <text x="80" y="382" font-size="18" fill="#8b949e">Signed + secured <tspan fill="#e6edf3">by default</tspan>.</text>

  <!-- guarantee chips -->
  <g font-size="15">
    <rect x="80" y="424" width="252" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <circle cx="102" cy="444" r="4" fill="#3fb950"/>
    <text x="116" y="450" fill="#c9d1d9">HMAC-signed messages</text>

    <rect x="348" y="424" width="252" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <circle cx="370" cy="444" r="4" fill="#58a6ff"/>
    <text x="384" y="450" fill="#c9d1d9">atomic work claims</text>

    <rect x="616" y="424" width="252" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <circle cx="638" cy="444" r="4" fill="#bc8cff"/>
    <text x="652" y="450" fill="#c9d1d9">durable fleet memory</text>

    <rect x="884" y="424" width="252" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <circle cx="906" cy="444" r="4" fill="#f85149"/>
    <text x="920" y="450" fill="#c9d1d9">auto-eviction — no ghosts</text>
  </g>

  <!-- mini demo strip: two sessions + the exchange -->
  <g transform="translate(80,500)">
    <rect width="520" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="30" font-size="13" fill="#8b949e">session B → <tspan fill="#bc8cff">mesh_claim_target</tspan></text>
    <text x="20" y="56" font-size="14" fill="#f85149">claim LOST — another session holds "gmtrade"</text>
    <text x="20" y="80" font-size="13" fill="#8b949e">→ <tspan fill="#bc8cff">mesh_dup_check</tspan> → <tspan fill="#3fb950" font-weight="bold">"overlap": true</tspan> — duplicate saved</text>
  </g>

  <g transform="translate(640,500)">
    <rect width="520" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="30" font-size="13" fill="#58a6ff">mesh mesh-demo · 2 peers</text>
    <text x="20" y="56" font-size="13" fill="#8b949e">  hunter-alpha  glm-5.3-flash  ctx:3%  <tspan fill="#58a6ff" font-weight="bold">⟨gmtrade⟩</tspan>  1s</text>
    <text x="20" y="80" font-size="13" fill="#8b949e">  hunter-beta   glm-5.3-flash  ctx:0%        2s</text>
  </g>

  <!-- connecting arrow between the two panels -->
  <line x1="610" y1="548" x2="634" y2="548" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arr2)"/>
</svg>
